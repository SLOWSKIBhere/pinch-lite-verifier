[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactlens-research"
version = "0.1.0"
description = "Local video OCR and provenance research prototype"
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless>=4.9,<5",
  "pytesseract>=0.3.10,<1"
]

[project.optional-dependencies]
dev = ["coverage>=7.4,<8"]

[project.scripts]
artifactlens = "artifactlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
