[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactlens-research"
version = "0.2.0"
description = "Local video OCR, transcript provenance, and evidence-integrity research prototype"
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless>=4.9,<5",
  "pytesseract>=0.3.10,<1"
]

[project.optional-dependencies]
dev = ["coverage>=7.4,<8"]

[project.scripts]
artifactlens = "artifactlens.cli:main"
artifactlens-research = "artifactlens.research_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
