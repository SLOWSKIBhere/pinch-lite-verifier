name: ArtifactLens research tests

on:
  push:
    branches:
      - "feature/artifactlens-claim-ledger-benchmark"
  pull_request:
    paths:
      - "artifactlens/**"
      - ".github/workflows/artifactlens.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ArtifactLens research module
        run: python -m pip install -e "artifactlens[dev]"
      - name: Run ArtifactLens unit tests
        working-directory: artifactlens
        run: python -m unittest discover -s tests -v
      - name: Check synthetic benchmark CLI
        working-directory: artifactlens
        run: artifactlens-research evaluate --dataset datasets/fixtures/synthetic_claim_eval.jsonl --out /tmp/artifactlens-metrics.json
